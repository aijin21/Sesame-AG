name: 🐞 Build Debug APK
run-name: 🐞 Debug Build - ${{ github.actor }}

on:
  push:
    branches: [ "n" ]
  pull_request:
    branches: [ "n" ]
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    concurrency:
      group: debug-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: ⏰ Set Timezone to Asia/Shanghai
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: 👨🏻‍💻 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: 🤝 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ☎️ Grant execute permission
        run: chmod +x gradlew

      - name: 🔥 Build Debug APK
        run: ./gradlew assembleDebug -Pversion=${{ github.ref_name }}

      - name: 📊 Locate Debug APKs
        id: locate_apks
        run: |
          debug_dir="app/build/outputs/apk/debug"
          universal_apk=$(find "$debug_dir" -name "*debug.apk" | head -n 1)
          echo "universal_apk=$universal_apk" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-universal
          path: ${{ steps.locate_apks.outputs.universal_apk }}
